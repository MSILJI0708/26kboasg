name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # trigger.py만 먼저 받아서 실행한다 (전체 데이터는 아직 받지 않음 → 가볍고 빠름).
      # sparse-checkout으로 필요한 파일만 받아 이 시점에 무거운 data/를 내려받지 않는다.
      - name: Checkout (trigger.py only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            trigger.py
          sparse-checkout-cone-mode: false

      - name: Install trigger dependencies
        run: pip install requests

      # ── 핵심 변경점 ──
      # 이전에는 Kboallstar.yml(수집)을 dispatch만 하고 응답을 기다리지 않은 채
      # 곧바로 chart_builder.py를 실행했다. 그 결과 수집이 끝나기 전의 옛날 data/로
      # 차트가 빌드되어 배포되는 문제가 있었다 (데이터 양이 늘며 수집 시간이 길어지자 더 심해짐).
      # trigger.py가 이제 dispatch 후 해당 run이 completed/success가 될 때까지
      # 폴링하며 대기하므로, 이 단계가 끝난 시점에는 수집이 100% 완료된 상태가 보장된다.
      #
      # 주의: 기본 제공되는 secrets.GITHUB_TOKEN은 보안상 다른 워크플로를
      # workflow_dispatch로 트리거할 권한이 없다 (403 Resource not accessible by integration).
      # 그래서 별도로 발급한 PAT(Fine-grained, Actions: Read&Write / Contents: Read&Write)를
      # WORKFLOW_PAT라는 이름의 저장소 시크릿으로 등록해 사용한다.
      - name: Trigger & wait for data collection
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: python trigger.py

      # 수집이 끝난 뒤에야 main을 전체 체크아웃한다.
      # Kboallstar.yml이 작업 끝에 push한 최신 data/, output/ 커밋을 그대로 받기 위해,
      # 위에서 받았던 sparse-checkout 상태를 풀고 전체 파일을 다시 받는다.
      - name: Checkout (full, after collection completes)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build chart
        env:
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          GITHUB_REPO_URL: "https://github.com/${{ github.repository }}"
        run: python chart_builder.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
