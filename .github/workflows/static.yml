name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        run: python trigger.py
        continue-on-error: true

      - name: Build chart (inject GitHub Pages URL)
        env:
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          GITHUB_REPO_URL: "https://github.com/${{ github.repository }}"
        run: python chart_builder.py

      - name: Inject site links into chart
        env:
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          GITHUB_REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          python3 -c "
          import os, re
          pages_url = os.environ['GITHUB_PAGES_URL']
          repo_url = os.environ['GITHUB_REPO_URL']
          with open('output/chart.html', 'r', encoding='utf-8') as f:
              html = f.read()
          # GitHub 링크 실제 URL로 교체
          html = html.replace('href=\"https://github.com/your-repo\"', f'href=\"{repo_url}\"')
          with open('output/chart.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print(f'✅ 링크 삽입 완료: {pages_url}')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
