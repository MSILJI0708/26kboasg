name: KBO 올스타 투표 수집

on:
  schedule:
    - cron: '0,30 * * * *'   # 매시 0분, 30분 실행 (UTC 기준)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # --- 이전 실행에서 쌓인 data/ 폴더 복원 ---
      - name: 이전 데이터 복원
        uses: actions/cache@v4
        with:
          path: data/
          key: kbo-data-${{ github.run_id }}
          restore-keys: |
            kbo-data-

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests openpyxl

      - name: 투표 데이터 수집
        run: python collector.py

      - name: 엑셀 파일 생성
        run: python processor.py

      # --- 결과물 업로드 (Actions 탭에서 다운로드 가능) ---
      - name: 엑셀 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: kbo_allstar_${{ github.run_number }}
          path: output/kbo_allstar.xlsx
          retention-days: 7    # 7일간 보관

      # --- data/ 폴더를 저장소에 커밋 (누적 보관) ---
      - name: 수집 데이터 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: 투표 데이터 수집 $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push