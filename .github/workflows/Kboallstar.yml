name: KBO 올스타 투표 수집



on:
  schedule:
    - cron: '/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kbo-allstar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests openpyxl

      - name: 투표 데이터 수집
        run: |
          python collector.py

      - name: 엑셀 파일 생성
        run: |
          python processor.py

      - name: 엑셀 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: kbo_allstar_${{ github.run_number }}
          path: output/*.xlsx
          retention-days: 1

      - name: 수집 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ output/

          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: 투표 데이터 수집 $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - name: 구글 드라이브 업로드
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
          filename: output/kbo_allstar.xlsx
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: "true"
