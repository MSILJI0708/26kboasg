name: KBO 올스타 투표 수집 및 배포

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kbo-allstar
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests openpyxl plotly pandas --quiet

      # ── 올스타 투표는 마감되었으므로 신규 수집을 중단한다 ──
      # collector.py(투표 수집)/processor.py(엑셀 갱신)는 더 이상 실행하지 않는다.
      # data/ 폴더의 기존 스냅샷은 그대로 두고 chart_builder.py가 과거 데이터로만 차트를 그린다.
      # - name: 투표 데이터 수집
      #   run: |
      #     python collector.py

      - name: 홈런더비 투표 데이터 수집
        run: |
          python homerun_collector.py
        continue-on-error: true

      # - name: 엑셀 파일 생성
      #   run: |
      #     python processor.py

      # ── 핵심 변경점 ──
      # 이전에는 static.yml이라는 별도 워크플로가 이 워크플로(Kboallstar.yml)를
      # API로 호출(workflow_dispatch)한 뒤 완료를 기다리려 했다. 그러나 기본 제공
      # GITHUB_TOKEN은 다른 워크플로를 트리거할 권한이 없어 403이 났고, 이를
      # 우회하려 별도 PAT를 쓰면 401(자격 증명 문제) 등 불필요하게 복잡했다.
      #
      # 현재는 올스타 투표(collector.py/processor.py)가 마감되어 비활성화되었고,
      # 홈런더비 수집(homerun_collector.py) → 차트 빌드(chart_builder.py) →
      # 배포(GitHub Pages)만 이 워크플로 "한 번의 실행" 안에서 순서대로 처리한다.
      - name: 차트 생성 (GitHub Pages용)
        env:
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          GITHUB_REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          python chart_builder.py

      - name: 엑셀 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: kbo_allstar_${{ github.run_number }}
          path: output/*.xlsx
          retention-days: 1

      - name: 수집 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ data_homerun/ output/
          echo "=== git status ==="
          git status
          echo "=== staged files ==="
          git diff --staged --name-only

          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: 투표 데이터 수집 $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: rclone 설치
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: 구글 드라이브 업로드 (엑셀)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF }}
          EOF
          rclone copyto output/kbo_allstar.xlsx gdrive:kbo_allstar.xlsx

      - name: 구글 드라이브 업로드 (차트)
        run: |
          rclone copyto output/chart.html gdrive:chart.html

      # ── 여기서부터 GitHub Pages 배포 (기존 static.yml의 역할) ──
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
