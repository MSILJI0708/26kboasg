name: KBO 올스타 투표 수집

on:
  schedule:
    - cron: '0,15,30,45 * * 3-23 6'  # 6월 1~21일, 매 15분마다 실행
  workflow_dispatch:                   # 수동 실행 버튼도 활성화

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 파일 커밋 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집
        run: python collector.py

      - name: 데이터 가공 및 엑셀 출력
        run: python processor.py

      - name: 추이 그래프 생성
        run: python chart.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git diff --cached --quiet || git commit -m "📊 투표 데이터 수집: $(date +'%Y-%m-%d %H:%M') KST"
          git push